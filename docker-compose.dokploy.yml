# Compose untuk produksi (Dokploy). Kode ikut di dalam image, data di volume.
# Di Dokploy: Create Service → Compose → Compose Path: ./docker-compose.dokploy.yml
# lalu tab Domains: tambahkan domain, Service Name "app", Container Port 80, HTTPS on.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - lpjbos-data:/var/www/data
    environment:
      DB_PATH: /var/www/data/lpjbos.sqlite
      DATA_DIR: /var/www/data
      TZ: Asia/Jakarta

volumes:
  lpjbos-data:
