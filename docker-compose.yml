# Compose produksi (Dokploy): kode di dalam image, data di volume lpjbos-data.
# Dev lokal: docker-compose.override.yml otomatis digabung (port 8080, mount ./data).
# Dokploy: tab Domains → Service Name "app", Container Port 80, HTTPS on.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - lpjbos-data:/var/www/data
    environment:
      DB_PATH: /var/www/data/lpjbos.sqlite
      DATA_DIR: /var/www/data
      TZ: Asia/Jakarta

volumes:
  lpjbos-data:
